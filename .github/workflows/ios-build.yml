name: iOS Build

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Apps and IPA
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List Xcode schemes
        run: xcodebuild -list -project ios/MochyMusic.xcodeproj

      - name: Check stream format selection
        run: |
          swiftc ios/MochyMusicApp/YouTubeStreamResolver.swift ios/Tests/StreamResolverChecks.swift -o "$RUNNER_TEMP/resolver-checks"
          "$RUNNER_TEMP/resolver-checks"

      - name: Check OAuth build configuration
        run: python3 ios/Tests/OAuthConfigurationChecks.py

      - name: Configure optional Google OAuth
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: python3 ios/Scripts/configure_oauth.py

      - name: Check library, queue, lyrics and catalog parsing
        run: |
          swiftc ios/MochyMusicApp/MusicModels.swift ios/MochyMusicApp/LibraryStore.swift ios/MochyMusicApp/CatalogAPI.swift ios/Tests/LibraryAndQueueChecks.swift -o "$RUNNER_TEMP/library-checks"
          "$RUNNER_TEMP/library-checks"

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ios/MochyMusic.xcodeproj
          -scheme MochyMusic
          -configuration Debug
          -derivedDataPath build/ios-simulator
          -destination 'generic/platform=iOS Simulator'
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Check glass layout on iPhone 16
        run: bash ios/Scripts/check_glass_layout.sh build/ios-simulator/Build/Products/Debug-iphonesimulator/MochyMusic.app com.apple.CoreSimulator.SimDeviceType.iPhone-16 build/MochyMusic-glass-standard

      - name: Check glass layout on small iPhone
        run: bash ios/Scripts/check_glass_layout.sh build/ios-simulator/Build/Products/Debug-iphonesimulator/MochyMusic.app com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation build/MochyMusic-glass-small

      - name: Build for iPhone
        run: >-
          xcodebuild
          -project ios/MochyMusic.xcodeproj
          -scheme MochyMusic
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/ios-device
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios-device/Build/Products/Release-iphoneos/MochyMusic.app"
          test -d "$APP_PATH"
          mkdir -p build/package/Payload
          cp -R "$APP_PATH" build/package/Payload/
          (cd build/package && zip -qry ../MochyMusic-unsigned.ipa Payload)
          unzip -t build/MochyMusic-unsigned.ipa
          echo "Unsigned iPhone build. Requires signing before installation. Minimum iOS: 17.0." > build/INSTALL-NOTE.txt

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: MochyMusic-iPhone-unsigned
          path: |
            build/MochyMusic-unsigned.ipa
            build/INSTALL-NOTE.txt
            build/MochyMusic-glass-*.png
          if-no-files-found: error
          retention-days: 7
